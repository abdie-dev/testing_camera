<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>💗 PHOTOBOOTH · LOVE FRAME</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #fce4ec;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== FLOATING HEARTS ===== */
        .hearts-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .heart-float {
            position: absolute;
            font-size: 1.5rem;
            opacity: 0.12;
            animation: floatHeart 20s infinite linear;
            color: #e91e63;
        }
        @keyframes floatHeart {
            0% { transform: translateY(100vh) rotate(0deg) scale(0.5); opacity: 0; }
            10% { opacity: 0.12; }
            90% { opacity: 0.12; }
            100% { transform: translateY(-10vh) rotate(720deg) scale(1.5); opacity: 0; }
        }
        .heart-float:nth-child(1) { left: 5%; animation-duration: 18s; font-size: 2rem; }
        .heart-float:nth-child(2) { left: 20%; animation-duration: 22s; font-size: 1.2rem; animation-delay: 3s; }
        .heart-float:nth-child(3) { left: 40%; animation-duration: 25s; font-size: 2.5rem; animation-delay: 5s; }
        .heart-float:nth-child(4) { left: 60%; animation-duration: 19s; font-size: 1.8rem; animation-delay: 2s; }
        .heart-float:nth-child(5) { left: 80%; animation-duration: 23s; font-size: 1.4rem; animation-delay: 7s; }
        .heart-float:nth-child(6) { left: 95%; animation-duration: 21s; font-size: 2rem; animation-delay: 4s; }

        /* ===== APP CARD ===== */
        .app-card {
            max-width: 480px;
            width: 100%;
            background: #ffffff;
            border-radius: 40px;
            padding: 20px 18px 24px;
            box-shadow: 0 20px 60px rgba(233, 30, 99, 0.2), 0 0 80px rgba(233, 30, 99, 0.08);
            border: 2px solid rgba(233, 30, 99, 0.1);
            position: relative;
            z-index: 1;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding: 0 2px;
        }
        .app-title {
            font-weight: 800;
            font-size: 1.3rem;
            color: #e91e63;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .app-title span {
            background: linear-gradient(135deg, #e91e63, #f06292);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .app-badge {
            font-size: 0.55rem;
            font-weight: 700;
            color: #e91e63;
            background: rgba(233, 30, 99, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(233, 30, 99, 0.15);
        }

        /* ===== CAMERA ===== */
        .camera-wrapper {
            position: relative;
            border-radius: 24px;
            overflow: hidden;
            background: #fce4ec;
            aspect-ratio: 4 / 3;
            width: 100%;
            border: 3px solid rgba(233, 30, 99, 0.2);
            box-shadow: inset 0 0 40px rgba(233, 30, 99, 0.05);
        }
        .camera-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .camera-wrapper canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }
        /* MIRROR OFF by default - preview normal */
        .camera-wrapper.mirror-on video,
        .camera-wrapper.mirror-on canvas {
            transform: scaleX(-1);
        }

        /* ===== OVERLAYS ===== */
        .overlay-countdown {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            border-radius: 24px;
        }
        .overlay-countdown.active {
            opacity: 1;
            pointer-events: auto;
        }
        .countdown-number {
            font-size: 7rem;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 60px rgba(233, 30, 99, 0.6), 0 0 120px rgba(233, 30, 99, 0.3);
            animation: pulseCount 0.7s ease-in-out infinite alternate;
            font-family: 'Quicksand', sans-serif;
        }
        @keyframes pulseCount {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.15); opacity: 0.5; }
        }
        .overlay-flash {
            position: absolute;
            inset: 0;
            background: #fff;
            z-index: 30;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.05s;
            border-radius: 24px;
        }
        .overlay-flash.active {
            opacity: 0.85;
            transition: opacity 0s;
        }

        .status-badge {
            position: absolute;
            bottom: 12px;
            left: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 5px 12px 5px 8px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            z-index: 10;
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4ade80;
            animation: blinkDot 1.2s infinite;
        }
        @keyframes blinkDot {
            0%,
            100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
        .status-dot.off {
            background: #f87171;
            animation: none;
        }
        .status-label {
            font-size: 0.5rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .filter-label {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 5px 12px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            z-index: 10;
            font-size: 0.5rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* ===== TOGGLES ===== */
        .toggle-row {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .toggle-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.6rem;
            font-weight: 600;
            color: #888;
            cursor: pointer;
            user-select: none;
            font-family: 'Quicksand', sans-serif;
        }
        .toggle-item input[type="checkbox"] {
            display: none;
        }
        .toggle-track {
            width: 36px;
            height: 20px;
            background: #f0f0f0;
            border-radius: 20px;
            position: relative;
            transition: all 0.3s;
            flex-shrink: 0;
            border: 1.5px solid #e0e0e0;
        }
        .toggle-track .toggle-thumb {
            width: 14px;
            height: 14px;
            background: #ccc;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: all 0.3s;
        }
        .toggle-item input:checked + .toggle-track {
            background: #fce4ec;
            border-color: #e91e63;
        }
        .toggle-item input:checked + .toggle-track .toggle-thumb {
            left: 18px;
            background: #e91e63;
            box-shadow: 0 0 20px rgba(233, 30, 99, 0.3);
        }

        /* ===== FILTERS ===== */
        .filters-scroll {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 4px 0 12px 0;
            margin-top: 12px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .filters-scroll::-webkit-scrollbar {
            display: none;
        }
        .filter-chip {
            flex: 0 0 auto;
            padding: 6px 16px;
            border-radius: 40px;
            border: 1.5px solid rgba(233, 30, 99, 0.1);
            background: rgba(233, 30, 99, 0.04);
            color: #888;
            font-size: 0.6rem;
            font-weight: 600;
            font-family: 'Quicksand', sans-serif;
            cursor: pointer;
            transition: all 0.25s;
            white-space: nowrap;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        .filter-chip:active {
            transform: scale(0.94);
        }
        .filter-chip.active {
            border-color: #e91e63;
            color: #e91e63;
            background: rgba(233, 30, 99, 0.1);
            box-shadow: 0 0 24px rgba(233, 30, 99, 0.08);
        }

        /* ===== CONTROLS ===== */
        .controls-row {
            display: flex;
            gap: 8px;
            margin-top: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn-capture {
            flex: 1;
            min-width: 120px;
            background: linear-gradient(135deg, #e91e63, #f06292);
            color: #fff;
            border: none;
            padding: 14px 20px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.9rem;
            font-family: 'Quicksand', sans-serif;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 24px rgba(233, 30, 99, 0.25);
            letter-spacing: 0.3px;
        }
        .btn-capture:active {
            transform: scale(0.96);
        }
        .btn-capture:disabled {
            opacity: 0.5;
            transform: none;
            box-shadow: none;
            cursor: not-allowed;
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid rgba(233, 30, 99, 0.15);
            color: #888;
            padding: 12px 14px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.75rem;
            font-family: 'Quicksand', sans-serif;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            min-width: 44px;
            flex: 0 1 auto;
            background: rgba(233, 30, 99, 0.03);
        }
        .btn-outline:active {
            transform: scale(0.94);
        }
        .btn-outline:hover {
            border-color: #e91e63;
            color: #e91e63;
        }

        /* ===== CAROUSEL ===== */
        .carousel-section {
            margin-top: 16px;
            border-top: 1.5px solid rgba(233, 30, 99, 0.08);
            padding-top: 14px;
        }
        .carousel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .carousel-header h3 {
            font-size: 0.65rem;
            font-weight: 700;
            color: #e91e63;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .carousel-header span {
            font-size: 0.55rem;
            color: #aaa;
            font-weight: 600;
        }

        .carousel-container {
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            background: #fce4ec;
            aspect-ratio: 4 / 3;
            border: 2px solid rgba(233, 30, 99, 0.1);
        }

        .carousel-track {
            display: flex;
            transition: transform 0.4s ease;
            height: 100%;
            width: 100%;
        }

        .carousel-slide {
            min-width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fce4ec;
        }

        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 12px;
        }

        /* LOVE FRAME OVERLAY di carousel */
        .love-frame-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
        }

        .love-frame-overlay svg {
            width: 100%;
            height: 100%;
            position: absolute;
            inset: 0;
        }

        .love-frame-overlay .frame-text {
            position: absolute;
            bottom: 18px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: #e91e63;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8), 0 0 40px rgba(255, 255, 255, 0.6);
            letter-spacing: 1px;
            background: rgba(255, 255, 255, 0.6);
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            width: auto;
            margin: 0 auto;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        /* Carousel buttons */
        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(233, 30, 99, 0.7);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            color: #fff;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1rem;
            cursor: pointer;
            z-index: 10;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 12px rgba(233, 30, 99, 0.3);
        }
        .carousel-btn:active {
            transform: translateY(-50%) scale(0.9);
        }
        .carousel-btn.prev {
            left: 8px;
        }
        .carousel-btn.next {
            right: 8px;
        }
        .carousel-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .carousel-dots {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-top: 8px;
        }
        .carousel-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ddd;
            transition: all 0.3s;
            cursor: pointer;
            border: none;
            padding: 0;
        }
        .carousel-dot.active {
            background: #e91e63;
            width: 20px;
            border-radius: 4px;
        }

        .empty-carousel {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #ccc;
            font-size: 0.8rem;
            font-weight: 600;
            flex-direction: column;
            gap: 4px;
        }
        .empty-carousel span {
            font-size: 2rem;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .app-card { padding: 14px 12px 18px; border-radius: 28px; }
            .countdown-number { font-size: 5rem; }
            .btn-capture { font-size: 0.75rem; padding: 12px 14px; min-width: 90px; }
            .btn-outline { padding: 10px 10px; font-size: 0.65rem; min-width: 38px; }
            .filter-chip { font-size: 0.5rem; padding: 5px 12px; }
            .app-title { font-size: 1.1rem; }
            .toggle-item { font-size: 0.55rem; }
            .toggle-track { width: 32px; height: 18px; }
            .toggle-track .toggle-thumb { width: 12px; height: 12px; }
            .toggle-item input:checked + .toggle-track .toggle-thumb { left: 16px; }
            .carousel-btn { width: 26px; height: 26px; font-size: 0.7rem; }
            .love-frame-overlay .frame-text { font-size: 0.6rem; bottom: 12px; padding: 3px 10px; }
        }
        @media (max-width: 380px) {
            .controls-row { gap: 4px; }
            .btn-capture { font-size: 0.65rem; padding: 10px 10px; min-width: 70px; }
            .btn-outline { padding: 8px 8px; font-size: 0.55rem; min-width: 34px; }
            .countdown-number { font-size: 4rem; }
        }
        @media (min-width: 768px) {
            .app-card { max-width: 520px; padding: 28px 24px 30px; border-radius: 44px; }
            .countdown-number { font-size: 9rem; }
        }
        @media (max-height: 600px) and (orientation: landscape) {
            .app-card { max-width: 400px; padding: 10px 14px 14px; border-radius: 24px; }
            .camera-wrapper { aspect-ratio: 16 / 9; }
            .countdown-number { font-size: 3.5rem; }
            .controls-row { margin-top: 8px; }
            .carousel-section { margin-top: 10px; padding-top: 10px; }
            .filters-scroll { margin-top: 6px; padding-bottom: 6px; }
            .toggle-row { margin-top: 6px; }
            .carousel-container { aspect-ratio: 16 / 9; max-height: 120px; }
        }
    </style>
</head>
<body>

    <!-- ===== FLOATING HEARTS ===== -->
    <div class="hearts-bg">
        <span class="heart-float">❤️</span>
        <span class="heart-float">💗</span>
        <span class="heart-float">💖</span>
        <span class="heart-float">💕</span>
        <span class="heart-float">❤️</span>
        <span class="heart-float">💗</span>
    </div>

    <!-- ===== APP CARD ===== -->
    <div class="app-card">

        <!-- HEADER -->
        <div class="app-header">
            <div class="app-title">
                <span>📸 PHOTOBOOTH</span>
                <span>💗</span>
            </div>
            <span class="app-badge">LOVE FRAME</span>
        </div>

        <!-- CAMERA -->
        <div class="camera-wrapper" id="cameraWrapper">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="filterCanvas"></canvas>

            <div class="overlay-countdown" id="countdownOverlay">
                <span class="countdown-number" id="countdownNumber">3</span>
            </div>
            <div class="overlay-flash" id="flashOverlay"></div>

            <div class="status-badge">
                <span class="status-dot" id="statusDot"></span>
                <span class="status-label" id="statusLabel">LIVE</span>
            </div>
            <span class="filter-label" id="filterLabel">ORIGINAL</span>
        </div>

        <!-- TOGGLES -->
        <div class="toggle-row">
            <label class="toggle-item">
                <input type="checkbox" id="mirrorToggle" />
                <span class="toggle-track"><span class="toggle-thumb"></span></span>
                <span>🪞 Mirror</span>
            </label>
            <label class="toggle-item">
                <input type="checkbox" id="flashToggle" checked />
                <span class="toggle-track"><span class="toggle-thumb"></span></span>
                <span>⚡ Flash</span>
            </label>
            <label class="toggle-item">
                <input type="checkbox" id="frameToggle" checked />
                <span class="toggle-track"><span class="toggle-thumb"></span></span>
                <span>💗 Frame</span>
            </label>
        </div>

        <!-- FILTERS -->
        <div class="filters-scroll" id="filterScroll">
            <button class="filter-chip active" data-filter="none">Original</button>
            <button class="filter-chip" data-filter="grayscale">Grayscale</button>
            <button class="filter-chip" data-filter="sepia">Sepia</button>
            <button class="filter-chip" data-filter="invert">Invert</button>
            <button class="filter-chip" data-filter="blur">Blur</button>
            <button class="filter-chip" data-filter="vintage">Vintage</button>
            <button class="filter-chip" data-filter="neon">Neon</button>
            <button class="filter-chip" data-filter="pink">💗 Pink</button>
            <button class="filter-chip" data-filter="love">💕 Love</button>
        </div>

        <!-- CONTROLS -->
        <div class="controls-row">
            <button class="btn-capture" id="captureBtn">📸 Capture</button>
            <button class="btn-outline" id="downloadBtn" title="Download latest">⬇️</button>
            <button class="btn-outline" id="clearBtn" title="Clear all">🗑️</button>
        </div>

        <!-- ===== CAROUSEL ===== -->
        <div class="carousel-section">
            <div class="carousel-header">
                <h3>💗 Gallery · Carousel</h3>
                <span id="carouselCount">0 photos</span>
            </div>
            <div class="carousel-container" id="carouselContainer">
                <div class="carousel-track" id="carouselTrack">
                    <div class="carousel-slide">
                        <div class="empty-carousel">
                            <span>💕</span>
                            No photos yet. Capture one!
                        </div>
                    </div>
                </div>
                <button class="carousel-btn prev" id="carouselPrev" disabled>‹</button>
                <button class="carousel-btn next" id="carouselNext" disabled>›</button>
            </div>
            <div class="carousel-dots" id="carouselDots"></div>
        </div>

    </div>

    <!-- ===== JAVASCRIPT ===== -->
    <script>
        (function() {
            'use strict';

            // ========== DOM ==========
            const video = document.getElementById('video');
            const canvas = document.getElementById('filterCanvas');
            const ctx = canvas.getContext('2d');
            const wrapper = document.getElementById('cameraWrapper');

            const captureBtn = document.getElementById('captureBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const clearBtn = document.getElementById('clearBtn');

            const countdownOverlay = document.getElementById('countdownOverlay');
            const countdownNumber = document.getElementById('countdownNumber');
            const flashOverlay = document.getElementById('flashOverlay');

            const mirrorToggle = document.getElementById('mirrorToggle');
            const flashToggle = document.getElementById('flashToggle');
            const frameToggle = document.getElementById('frameToggle');

            const filterChips = document.querySelectorAll('.filter-chip');
            const filterLabel = document.getElementById('filterLabel');

            const statusDot = document.getElementById('statusDot');
            const statusLabel = document.getElementById('statusLabel');

            const carouselTrack = document.getElementById('carouselTrack');
            const carouselPrev = document.getElementById('carouselPrev');
            const carouselNext = document.getElementById('carouselNext');
            const carouselDots = document.getElementById('carouselDots');
            const carouselCount = document.getElementById('carouselCount');

            // ========== STATE ==========
            let stream = null;
            let currentFilter = 'none';
            let isCapturing = false;
            let isMirror = false; // DEFAULT: NORMAL (ga mirror)
            let useFlash = true;
            let useFrame = true;
            let photos = [];
            let videoReady = false;
            let animFrame = null;
            let canvasWidth = 640;
            let canvasHeight = 480;
            let currentSlide = 0;

            // ========== MANUAL FILTERS ==========
            function applyFilter(imageData, filterName) {
                const data = imageData.data;
                const len = data.length;
                const w = imageData.width;
                const h = imageData.height;

                switch (filterName) {
                    case 'none':
                        break;
                    case 'grayscale':
                        for (let i = 0; i < len; i += 4) {
                            const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                            data[i] = data[i + 1] = data[i + 2] = gray;
                        }
                        break;
                    case 'sepia':
                        for (let i = 0; i < len; i += 4) {
                            const r = data[i],
                                g = data[i + 1],
                                b = data[i + 2];
                            data[i] = Math.min(255, r * 0.393 + g * 0.769 + b * 0.189);
                            data[i + 1] = Math.min(255, r * 0.349 + g * 0.686 + b * 0.168);
                            data[i + 2] = Math.min(255, r * 0.272 + g * 0.534 + b * 0.131);
                        }
                        break;
                    case 'invert':
                        for (let i = 0; i < len; i += 4) {
                            data[i] = 255 - data[i];
                            data[i + 1] = 255 - data[i + 1];
                            data[i + 2] = 255 - data[i + 2];
                        }
                        break;
                    case 'blur': {
                        const temp = new Uint8ClampedArray(data);
                        for (let y = 1; y < h - 1; y++) {
                            for (let x = 1; x < w - 1; x++) {
                                const idx = (y * w + x) * 4;
                                let r = 0,
                                    g = 0,
                                    b = 0;
                                for (let dy = -1; dy <= 1; dy++) {
                                    for (let dx = -1; dx <= 1; dx++) {
                                        const nIdx = ((y + dy) * w + (x + dx)) * 4;
                                        r += temp[nIdx];
                                        g += temp[nIdx + 1];
                                        b += temp[nIdx + 2];
                                    }
                                }
                                data[idx] = r / 9;
                                data[idx + 1] = g / 9;
                                data[idx + 2] = b / 9;
                            }
                        }
                        break;
                    }
                    case 'vintage':
                        for (let i = 0; i < len; i += 4) {
                            const r = data[i],
                                g = data[i + 1],
                                b = data[i + 2];
                            data[i] = Math.min(255, r * 0.8 + g * 0.6 + b * 0.2);
                            data[i + 1] = Math.min(255, r * 0.5 + g * 0.7 + b * 0.3);
                            data[i + 2] = Math.min(255, r * 0.3 + g * 0.5 + b * 0.6);
                            const grain = (Math.random() - 0.5) * 12;
                            data[i] = Math.max(0, Math.min(255, data[i] + grain));
                            data[i + 1] = Math.max(0, Math.min(255, data[i + 1] + grain));
                            data[i + 2] = Math.max(0, Math.min(255, data[i + 2] + grain));
                        }
                        break;
                    case 'neon':
                        for (let i = 0; i < len; i += 4) {
                            data[i] = Math.min(255, data[i] * 1.8);
                            data[i + 1] = Math.min(255, data[i + 1] * 1.0);
                            data[i + 2] = Math.min(255, data[i + 2] * 1.4);
                        }
                        break;
                    case 'pink':
                        for (let i = 0; i < len; i += 4) {
                            data[i] = Math.min(255, data[i] * 1.1);
                            data[i + 1] = Math.min(255, data[i + 1] * 0.8);
                            data[i + 2] = Math.min(255, data[i + 2] * 0.9 + 30);
                        }
                        break;
                    case 'love':
                        for (let i = 0; i < len; i += 4) {
                            const r = data[i],
                                g = data[i + 1],
                                b = data[i + 2];
                            data[i] = Math.min(255, r * 1.2 + 20);
                            data[i + 1] = Math.min(255, g * 0.7 + 10);
                            data[i + 2] = Math.min(255, b * 0.6 + 40);
                            const x = (i / 4) % w;
                            const y = Math.floor((i / 4) / w);
                            const cx = w / 2,
                                cy = h / 2;
                            const dist = Math.sqrt((x - cx) ** 2 + (y - cy) ** 2);
                            const maxDist = Math.sqrt(cx ** 2 + cy ** 2);
                            const vignette = 1 - (dist / maxDist) * 0.3;
                            data[i] = Math.min(255, data[i] * vignette);
                            data[i + 1] = Math.min(255, data[i + 1] * vignette);
                            data[i + 2] = Math.min(255, data[i + 2] * vignette);
                        }
                        break;
                    default:
                        break;
                }
                return imageData;
            }

            // ========== DRAW LOVE FRAME ==========
            function drawLoveFrame(ctx, w, h) {
                if (!useFrame) return;
                const padding = 12;
                const cornerSize = 30;
                const heartSize = 28;

                // Border pink
                ctx.strokeStyle = 'rgba(233, 30, 99, 0.5)';
                ctx.lineWidth = 4;
                ctx.setLineDash([]);
                ctx.strokeRect(padding, padding, w - padding * 2, h - padding * 2);

                // Corner hearts
                const corners = [
                    [padding + 6, padding + 6],
                    [w - padding - 6, padding + 6],
                    [padding + 6, h - padding - 6],
                    [w - padding - 6, h - padding - 6]
                ];
                ctx.font = `${heartSize}px "Segoe UI Emoji", "Apple Color Emoji", sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(233,30,99,0.3)';
                ctx.shadowBlur = 10;
                corners.forEach(([x, y]) => {
                    ctx.fillStyle = '#e91e63';
                    ctx.fillText('❤️', x, y);
                });
                ctx.shadowBlur = 0;

                // Bottom text
                ctx.font = '600 14px Quicksand, sans-serif';
                ctx.fillStyle = 'rgba(233, 30, 99, 0.7)';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.fillText('💕  LOVE  💕', w / 2, h - 10);
            }

            // ========== CAMERA ==========
            async function initCamera() {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: 'user',
                            width: { ideal: 640 },
                            height: { ideal: 480 }
                        },
                        audio: false
                    });
                    video.srcObject = stream;
                    await video.play();
                    videoReady = true;

                    const vw = video.videoWidth || 640;
                    const vh = video.videoHeight || 480;
                    canvasWidth = Math.min(vw, 640);
                    canvasHeight = Math.min(vh, 480);
                    canvas.width = canvasWidth;
                    canvas.height = canvasHeight;

                    statusDot.className = 'status-dot';
                    statusLabel.textContent = 'LIVE';
                    console.log('📸 Camera ready!');
                    startRender();
                } catch (err) {
                    console.error('Camera error:', err);
                    statusDot.className = 'status-dot off';
                    statusLabel.textContent = 'OFFLINE';
                    alert('⚠️ Camera access denied or no camera found.');
                }
            }

            // ========== RENDER ==========
            function startRender() {
                if (animFrame) cancelAnimationFrame(animFrame);
                render();
            }

            function render() {
                if (!videoReady || !video.videoWidth) {
                    animFrame = requestAnimationFrame(render);
                    return;
                }

                ctx.save();
                if (isMirror) {
                    ctx.translate(canvas.width, 0);
                    ctx.scale(-1, 1);
                }
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                ctx.restore();

                if (currentFilter !== 'none') {
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    applyFilter(imageData, currentFilter);
                    ctx.putImageData(imageData, 0, 0);
                }

                drawLoveFrame(ctx, canvas.width, canvas.height);

                animFrame = requestAnimationFrame(render);
            }

            // ========== CAPTURE ==========
            async function capturePhoto() {
                if (isCapturing || !videoReady) return;
                isCapturing = true;
                captureBtn.disabled = true;

                countdownOverlay.classList.add('active');
                for (let i = 3; i >= 1; i--) {
                    countdownNumber.textContent = i;
                    await sleep(700);
                }
                countdownNumber.textContent = '💗';
                await sleep(250);
                countdownOverlay.classList.remove('active');

                if (useFlash) {
                    flashOverlay.classList.add('active');
                    await sleep(120);
                    flashOverlay.classList.remove('active');
                }

                // CAPTURE dengan semua effect + frame
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                const tCtx = tempCanvas.getContext('2d');

                // 1. Draw video dengan mirror
                tCtx.save();
                if (isMirror) {
                    tCtx.translate(canvas.width, 0);
                    tCtx.scale(-1, 1);
                }
                tCtx.drawImage(video, 0, 0, canvas.width, canvas.height);
                tCtx.restore();

                // 2. Apply filter
                if (currentFilter !== 'none') {
                    const imgData = tCtx.getImageData(0, 0, canvas.width, canvas.height);
                    applyFilter(imgData, currentFilter);
                    tCtx.putImageData(imgData, 0, 0);
                }

                // 3. Draw LOVE FRAME
                drawLoveFrame(tCtx, canvas.width, canvas.height);

                const dataUrl = tempCanvas.toDataURL('image/jpeg', 0.92);

                photos.push(dataUrl);
                renderCarousel();
                downloadImage(dataUrl, `photobooth_${Date.now()}.jpg`);

                isCapturing = false;
                captureBtn.disabled = false;
                console.log('📸 Captured! Effect + Frame applied!');
            }

            // ========== CAROUSEL ==========
            function renderCarousel() {
                const total = photos.length;
                carouselCount.textContent = `${total} photos`;

                if (total === 0) {
                    carouselTrack.innerHTML = `
                        <div class="carousel-slide">
                            <div class="empty-carousel">
                                <span>💕</span>
                                No photos yet. Capture one!
                            </div>
                        </div>
                    `;
                    carouselDots.innerHTML = '';
                    carouselPrev.disabled = true;
                    carouselNext.disabled = true;
                    currentSlide = 0;
                    return;
                }

                // Build slides
                let slidesHTML = '';
                photos.forEach((dataUrl, idx) => {
                    slidesHTML += `
                        <div class="carousel-slide">
                            <img src="${dataUrl}" alt="Photo ${idx+1}" loading="lazy" />
                            <div class="love-frame-overlay">
                                <svg viewBox="0 0 100 100" preserveAspectRatio="none">
                                    <rect x="4" y="4" width="92" height="92" rx="8" 
                                          fill="none" stroke="rgba(233,30,99,0.25)" stroke-width="2" />
                                    <text x="50" y="14" text-anchor="middle" font-size="10" 
                                          fill="rgba(233,30,99,0.5)" font-family="Quicksand" font-weight="700">
                                        ❤️
                                    </text>
                                    <text x="50" y="92" text-anchor="middle" font-size="8" 
                                          fill="rgba(233,30,99,0.4)" font-family="Quicksand" font-weight="600">
                                        💕 LOVE 💕
                                    </text>
                                </svg>
                            </div>
                        </div>
                    `;
                });

                carouselTrack.innerHTML = slidesHTML;

                // Dots
                let dotsHTML = '';
                for (let i = 0; i < total; i++) {
                    dotsHTML += `<button class="carousel-dot ${i === currentSlide ? 'active' : ''}" data-index="${i}"></button>`;
                }
                carouselDots.innerHTML = dotsHTML;

                // Dot click
                carouselDots.querySelectorAll('.carousel-dot').forEach(dot => {
                    dot.addEventListener('click', function() {
                        goToSlide(parseInt(this.dataset.index));
                    });
                });

                // Update buttons
                carouselPrev.disabled = total <= 1;
                carouselNext.disabled = total <= 1;

                // Go to current slide
                goToSlide(Math.min(currentSlide, total - 1));
            }

            function goToSlide(index) {
                const total = photos.length;
                if (total === 0) return;
                currentSlide = Math.max(0, Math.min(index, total - 1));
                carouselTrack.style.transform = `translateX(-${currentSlide * 100}%)`;
                // Update dots
                carouselDots.querySelectorAll('.carousel-dot').forEach((dot, i) => {
                    dot.classList.toggle('active', i === currentSlide);
                });
            }

            // ========== DOWNLOAD (dengan effect & frame) ==========
            function downloadImage(dataUrl, filename = 'photobooth.jpg') {
                const link = document.createElement('a');
                link.download = filename;
                link.href = dataUrl;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }

            // ========== CLEAR ==========
            function clearAll() {
                if (photos.length === 0) return;
                if (confirm('🗑️ Delete all photos?')) {
                    photos = [];
                    renderCarousel();
                }
            }

            // ========== SLEEP ==========
            function sleep(ms) {
                return new Promise(r => setTimeout(r, ms));
            }

            // ========== EVENT LISTENERS ==========

            // Filter
            filterChips.forEach(chip => {
                chip.addEventListener('click', function() {
                    filterChips.forEach(c => c.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    const labels = {
                        none: 'ORIGINAL',
                        grayscale: 'GRAYSCALE',
                        sepia: 'SEPIA',
                        invert: 'INVERT',
                        blur: 'BLUR',
                        vintage: 'VINTAGE',
                        neon: 'NEON',
                        pink: '💗 PINK',
                        love: '💕 LOVE'
                    };
                    filterLabel.textContent = labels[currentFilter] || 'ORIGINAL';
                    console.log('🎨 Filter:', currentFilter);
                });
            });

            // Mirror (default OFF = normal preview)
            mirrorToggle.addEventListener('change', function() {
                isMirror = this.checked;
                wrapper.classList.toggle('mirror-on', isMirror);
                console.log('🪞 Mirror:', isMirror ? 'ON' : 'OFF');
            });

            flashToggle.addEventListener('change', function() {
                useFlash = this.checked;
                console.log('⚡ Flash:', useFlash ? 'ON' : 'OFF');
            });

            frameToggle.addEventListener('change', function() {
                useFrame = this.checked;
                console.log('💗 Frame:', useFrame ? 'ON' : 'OFF');
            });

            captureBtn.addEventListener('click', capturePhoto);

            downloadBtn.addEventListener('click', () => {
                if (photos.length === 0) {
                    alert('📸 No photos to download!');
                    return;
                }
                downloadImage(photos[photos.length - 1], `photobooth_${Date.now()}.jpg`);
            });

            clearBtn.addEventListener('click', clearAll);

            // Carousel buttons
            carouselPrev.addEventListener('click', () => {
                if (currentSlide > 0) goToSlide(currentSlide - 1);
            });
            carouselNext.addEventListener('click', () => {
                if (currentSlide < photos.length - 1) goToSlide(currentSlide + 1);
            });

            // Keyboard
            document.addEventListener('keydown', (e) => {
                if (e.key === ' ' || e.key === 'Enter') { e.preventDefault();
                    capturePhoto(); }
                if (e.key === 'd' || e.key === 'D') downloadBtn.click();
                if (e.key === 'c' || e.key === 'C') clearBtn.click();
                if (e.key === 'ArrowLeft' && photos.length > 0) carouselPrev.click();
                if (e.key === 'ArrowRight' && photos.length > 0) carouselNext.click();
            });

            // ========== INIT ==========
            initCamera();

            console.log('💗 PHOTOBOOTH LOVE FRAME · FABLE 5');
            console.log('🎯 Space/Enter = Capture | D = Download | C = Clear');
            console.log('🪞 Mirror OFF by default (normal preview)');
            console.log('💗 Frame ON by default');
            console.log('📸 Effect + Frame saved in downloaded image!');

        })();
    </script>

</body>
