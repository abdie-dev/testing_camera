<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>📸 PHOTOBOOTH · PINK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ===== FONTS ===== */
        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0d0d0d;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        /* ===== MAIN CARD ===== */
        .app-card {
            max-width: 480px;
            width: 100%;
            background: #1a1a1a;
            border-radius: 40px;
            padding: 24px 20px 28px;
            box-shadow: 0 20px 60px rgba(255, 45, 120, 0.15), 0 0 80px rgba(255, 45, 120, 0.05);
            border: 1px solid rgba(255, 45, 120, 0.15);
            transition: all 0.3s;
        }

        /* ===== HEADER ===== */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            padding: 0 4px;
        }

        .app-title {
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #FF2D78, #FF6B9D);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .app-badge {
            font-size: 0.6rem;
            font-weight: 700;
            color: #FF2D78;
            background: rgba(255, 45, 120, 0.12);
            padding: 4px 12px;
            border-radius: 20px;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 45, 120, 0.2);
        }

        /* ===== WEBCAM CONTAINER ===== */
        .camera-wrapper {
            position: relative;
            border-radius: 24px;
            overflow: hidden;
            background: #111;
            aspect-ratio: 4 / 3;
            width: 100%;
            border: 2px solid rgba(255, 45, 120, 0.2);
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.6);
        }

        .camera-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .camera-wrapper canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        /* Mirror toggle: flip via CSS class on video + canvas */
        .camera-wrapper.mirror-on video,
        .camera-wrapper.mirror-on canvas {
            transform: scaleX(-1);
        }

        /* ===== OVERLAYS ===== */
        .overlay-countdown {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .overlay-countdown.active {
            opacity: 1;
            pointer-events: auto;
        }

        .countdown-number {
            font-size: 8rem;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 60px rgba(255, 45, 120, 0.7), 0 0 120px rgba(255, 45, 120, 0.3);
            animation: pulse 0.7s ease-in-out infinite alternate;
            font-family: 'Inter', sans-serif;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.15); opacity: 0.5; }
        }

        .overlay-flash {
            position: absolute;
            inset: 0;
            background: white;
            z-index: 30;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.05s;
        }

        .overlay-flash.active {
            opacity: 0.85;
            transition: opacity 0s;
        }

        /* Status dot */
        .status-badge {
            position: absolute;
            bottom: 14px;
            left: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 6px 14px 6px 10px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            z-index: 10;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
            animation: blink 1.2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        .status-dot.off {
            background: #f87171;
            animation: none;
        }

        .status-label {
            font-size: 0.6rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Filter label */
        .filter-label {
            position: absolute;
            bottom: 14px;
            right: 14px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            z-index: 10;
            font-size: 0.55rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* ===== CONTROLS ROW ===== */
        .controls-row {
            display: flex;
            gap: 10px;
            margin-top: 18px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-capture {
            flex: 1;
            min-width: 140px;
            background: linear-gradient(135deg, #FF2D78, #FF6B9D);
            color: #fff;
            border: none;
            padding: 14px 20px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 24px rgba(255, 45, 120, 0.3);
            letter-spacing: 0.3px;
        }

        .btn-capture:active {
            transform: scale(0.96);
        }

        .btn-capture:disabled {
            opacity: 0.5;
            transform: none;
            box-shadow: none;
            cursor: not-allowed;
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            color: #ccc;
            padding: 12px 16px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.8rem;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-width: 48px;
            flex: 0 1 auto;
            background: rgba(255, 255, 255, 0.03);
        }

        .btn-outline:active {
            transform: scale(0.94);
        }

        .btn-outline.active {
            border-color: #FF2D78;
            color: #FF2D78;
            background: rgba(255, 45, 120, 0.08);
        }

        /* ===== FILTERS ROW ===== */
        .filters-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0 12px 0;
            margin-top: 16px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .filters-scroll::-webkit-scrollbar {
            display: none;
        }

        .filter-chip {
            flex: 0 0 auto;
            padding: 7px 18px;
            border-radius: 40px;
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.03);
            color: #888;
            font-size: 0.65rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.25s;
            white-space: nowrap;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .filter-chip:active {
            transform: scale(0.94);
        }

        .filter-chip.active {
            border-color: #FF2D78;
            color: #fff;
            background: rgba(255, 45, 120, 0.15);
            box-shadow: 0 0 24px rgba(255, 45, 120, 0.15);
        }

        /* ===== GALLERY ===== */
        .gallery-section {
            margin-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 16px;
        }

        .gallery-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .gallery-header h3 {
            font-size: 0.7rem;
            font-weight: 700;
            color: #aaa;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .gallery-header span {
            font-size: 0.6rem;
            color: #666;
            font-weight: 600;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            max-height: 140px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .gallery-grid::-webkit-scrollbar {
            width: 3px;
        }

        .gallery-grid::-webkit-scrollbar-track {
            background: transparent;
        }

        .gallery-grid::-webkit-scrollbar-thumb {
            background: #FF2D78;
            border-radius: 10px;
        }

        .gallery-item {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 4 / 3;
            background: #1a1a1a;
            border: 1.5px solid rgba(255, 255, 255, 0.04);
            cursor: pointer;
            transition: all 0.2s;
        }

        .gallery-item:active {
            transform: scale(0.94);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gallery-item .delete-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: none;
            color: #fff;
            font-size: 12px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .gallery-item:hover .delete-btn {
            opacity: 1;
        }

        .gallery-item .delete-btn:active {
            background: #FF2D78;
        }

        .empty-gallery {
            text-align: center;
            color: #444;
            font-size: 0.7rem;
            font-weight: 500;
            padding: 16px 0;
            grid-column: 1 / -1;
        }

        /* ===== TOGGLE ROW ===== */
        .toggle-row {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .toggle-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.65rem;
            font-weight: 600;
            color: #888;
            cursor: pointer;
            user-select: none;
            font-family: 'Inter', sans-serif;
        }

        .toggle-item input[type="checkbox"] {
            display: none;
        }

        .toggle-track {
            width: 40px;
            height: 22px;
            background: #2a2a2a;
            border-radius: 20px;
            position: relative;
            transition: all 0.3s;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .toggle-track .toggle-thumb {
            width: 16px;
            height: 16px;
            background: #555;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: all 0.3s;
        }

        .toggle-item input:checked + .toggle-track {
            background: rgba(255, 45, 120, 0.25);
            border-color: #FF2D78;
        }

        .toggle-item input:checked + .toggle-track .toggle-thumb {
            left: 20px;
            background: #FF2D78;
            box-shadow: 0 0 20px rgba(255, 45, 120, 0.4);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .app-card {
                padding: 16px 14px 20px;
                border-radius: 28px;
            }
            .countdown-number {
                font-size: 5rem;
            }
            .btn-capture {
                font-size: 0.8rem;
                padding: 12px 16px;
                min-width: 100px;
            }
            .btn-outline {
                padding: 10px 12px;
                font-size: 0.7rem;
            }
            .gallery-grid {
                grid-template-columns: repeat(4, 1fr);
                max-height: 110px;
            }
            .filter-chip {
                font-size: 0.55rem;
                padding: 5px 14px;
            }
            .app-title {
                font-size: 1rem;
            }
        }

        @media (max-width: 380px) {
            .controls-row {
                gap: 6px;
            }
            .btn-capture {
                font-size: 0.7rem;
                padding: 10px 12px;
                min-width: 80px;
            }
            .btn-outline {
                padding: 8px 10px;
                font-size: 0.6rem;
                min-width: 40px;
            }
            .gallery-grid {
                grid-template-columns: repeat(3, 1fr);
                max-height: 100px;
            }
        }

        @media (min-width: 768px) {
            .app-card {
                max-width: 520px;
                padding: 32px 28px 32px;
                border-radius: 48px;
            }
            .countdown-number {
                font-size: 10rem;
            }
            .gallery-grid {
                grid-template-columns: repeat(4, 1fr);
                max-height: 160px;
            }
        }

        /* Landscape phone fix */
        @media (max-height: 600px) and (orientation: landscape) {
            .app-card {
                max-width: 400px;
                padding: 12px 16px 16px;
            }
            .camera-wrapper {
                aspect-ratio: 16 / 9;
            }
            .gallery-grid {
                max-height: 80px;
            }
            .countdown-number {
                font-size: 4rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== APP CARD ===== -->
    <div class="app-card">

        <!-- HEADER -->
        <div class="app-header">
            <span class="app-title">📸 PHOTOBOOTH</span>
            <span class="app-badge">FABLE 5</span>
        </div>

        <!-- CAMERA -->
        <div class="camera-wrapper mirror-on" id="cameraWrapper">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="filterCanvas"></canvas>

            <!-- Countdown -->
            <div class="overlay-countdown" id="countdownOverlay">
                <span class="countdown-number" id="countdownNumber">3</span>
            </div>

            <!-- Flash -->
            <div class="overlay-flash" id="flashOverlay"></div>

            <!-- Status -->
            <div class="status-badge">
                <span class="status-dot" id="statusDot"></span>
                <span class="status-label" id="statusLabel">LIVE</span>
            </div>

            <!-- Filter Label -->
            <span class="filter-label" id="filterLabel">ORIGINAL</span>
        </div>

        <!-- TOGGLES -->
        <div class="toggle-row">
            <label class="toggle-item">
                <input type="checkbox" id="mirrorToggle" checked />
                <span class="toggle-track"><span class="toggle-thumb"></span></span>
                <span>🪞 Mirror</span>
            </label>
            <label class="toggle-item">
                <input type="checkbox" id="flashToggle" checked />
                <span class="toggle-track"><span class="toggle-thumb"></span></span>
                <span>⚡ Flash</span>
            </label>
        </div>

        <!-- FILTERS -->
        <div class="filters-scroll" id="filterScroll">
            <button class="filter-chip active" data-filter="none">Original</button>
            <button class="filter-chip" data-filter="grayscale">Grayscale</button>
            <button class="filter-chip" data-filter="sepia">Sepia</button>
            <button class="filter-chip" data-filter="invert">Invert</button>
            <button class="filter-chip" data-filter="blur">Blur</button>
            <button class="filter-chip" data-filter="vintage">Vintage</button>
            <button class="filter-chip" data-filter="neon">Neon</button>
            <button class="filter-chip" data-filter="pink">Pink Tint</button>
        </div>

        <!-- CONTROLS -->
        <div class="controls-row">
            <button class="btn-capture" id="captureBtn">📸 Capture</button>
            <button class="btn-outline" id="downloadBtn" title="Download latest">⬇️</button>
            <button class="btn-outline" id="clearBtn" title="Clear all">🗑️</button>
        </div>

        <!-- GALLERY -->
        <div class="gallery-section">
            <div class="gallery-header">
                <h3>📷 Gallery</h3>
                <span id="galleryCount">0 photos</span>
            </div>
            <div class="gallery-grid" id="galleryGrid">
                <div class="empty-gallery">No photos yet. Capture one!</div>
            </div>
        </div>

    </div>

    <!-- ===== JAVASCRIPT ===== -->
    <script>
        (function() {
            'use strict';

            // ========== DOM ==========
            const video = document.getElementById('video');
            const canvas = document.getElementById('filterCanvas');
            const ctx = canvas.getContext('2d');
            const wrapper = document.getElementById('cameraWrapper');

            const captureBtn = document.getElementById('captureBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const clearBtn = document.getElementById('clearBtn');

            const countdownOverlay = document.getElementById('countdownOverlay');
            const countdownNumber = document.getElementById('countdownNumber');
            const flashOverlay = document.getElementById('flashOverlay');

            const mirrorToggle = document.getElementById('mirrorToggle');
            const flashToggle = document.getElementById('flashToggle');

            const filterChips = document.querySelectorAll('.filter-chip');
            const filterLabel = document.getElementById('filterLabel');

            const statusDot = document.getElementById('statusDot');
            const statusLabel = document.getElementById('statusLabel');

            const galleryGrid = document.getElementById('galleryGrid');
            const galleryCount = document.getElementById('galleryCount');

            // ========== STATE ==========
            let stream = null;
            let currentFilter = 'none';
            let isCapturing = false;
            let isMirror = true;
            let useFlash = true;
            let photos = [];
            let videoReady = false;
            let animFrame = null;
            let canvasWidth = 640;
            let canvasHeight = 480;

            // ========== FILTER MAP ==========
            const filters = {
                none: { label: 'ORIGINAL', css: '' },
                grayscale: { label: 'GRAYSCALE', css: 'grayscale(100%)' },
                sepia: { label: 'SEPIA', css: 'sepia(100%)' },
                invert: { label: 'INVERT', css: 'invert(100%)' },
                blur: { label: 'BLUR', css: 'blur(3px)' },
                vintage: { label: 'VINTAGE', css: 'sepia(60%) contrast(1.2) brightness(0.9)' },
                neon: { label: 'NEON', css: 'saturate(220%) contrast(1.4) brightness(1.05)' },
                pink: { label: 'PINK TINT', css: 'sepia(30%) saturate(180%) hue-rotate(320deg)' }
            };

            // ========== CAMERA INIT ==========
            async function initCamera() {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: 'user',
                            width: { ideal: 1280 },
                            height: { ideal: 720 }
                        },
                        audio: false
                    });
                    video.srcObject = stream;
                    await video.play();
                    videoReady = true;

                    // Set canvas size
                    const vw = video.videoWidth || 1280;
                    const vh = video.videoHeight || 720;
                    canvasWidth = vw;
                    canvasHeight = vh;
                    canvas.width = vw;
                    canvas.height = vh;

                    statusDot.className = 'status-dot';
                    statusLabel.textContent = 'LIVE';
                    console.log('📸 Camera ready');
                    startRender();
                } catch (err) {
                    console.error('Camera error:', err);
                    statusDot.className = 'status-dot off';
                    statusLabel.textContent = 'OFFLINE';
                    alert('⚠️ Camera access denied or no camera found.');
                }
            }

            // ========== RENDER LOOP ==========
            function startRender() {
                if (animFrame) cancelAnimationFrame(animFrame);
                render();
            }

            function render() {
                if (!videoReady || !video.videoWidth) {
                    animFrame = requestAnimationFrame(render);
                    return;
                }

                const filter = filters[currentFilter]?.css || '';
                ctx.save();

                // Mirror via canvas transform (if mirror is ON)
                if (isMirror) {
                    ctx.translate(canvas.width, 0);
                    ctx.scale(-1, 1);
                }

                // Apply filter
                ctx.filter = filter;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                ctx.restore();

                animFrame = requestAnimationFrame(render);
            }

            // ========== CAPTURE ==========
            async function capturePhoto() {
                if (isCapturing || !videoReady) return;
                isCapturing = true;
                captureBtn.disabled = true;

                // Countdown
                countdownOverlay.classList.add('active');
                for (let i = 3; i >= 1; i--) {
                    countdownNumber.textContent = i;
                    await sleep(700);
                }
                countdownNumber.textContent = '📸';
                await sleep(250);
                countdownOverlay.classList.remove('active');

                // Flash
                if (useFlash) {
                    flashOverlay.classList.add('active');
                    await sleep(120);
                    flashOverlay.classList.remove('active');
                }

                // Capture from canvas
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                const tCtx = tempCanvas.getContext('2d');

                const filter = filters[currentFilter]?.css || '';
                tCtx.filter = filter;

                // Apply mirror if needed (same as render)
                if (isMirror) {
                    tCtx.translate(canvas.width, 0);
                    tCtx.scale(-1, 1);
                }
                tCtx.drawImage(video, 0, 0, canvas.width, canvas.height);
                tCtx.restore();

                const dataUrl = tempCanvas.toDataURL('image/jpeg', 0.94);

                // Add to gallery
                photos.push(dataUrl);
                renderGallery();

                // Auto download
                downloadImage(dataUrl, `photobooth_${Date.now()}.jpg`);

                isCapturing = false;
                captureBtn.disabled = false;
                console.log('📸 Captured!');
            }

            // ========== GALLERY ==========
            function renderGallery() {
                galleryGrid.innerHTML = '';
                if (photos.length === 0) {
                    galleryGrid.innerHTML = '<div class="empty-gallery">No photos yet. Capture one!</div>';
                    galleryCount.textContent = '0 photos';
                    return;
                }
                galleryCount.textContent = `${photos.length} photos`;

                photos.forEach((dataUrl, idx) => {
                    const div = document.createElement('div');
                    div.className = 'gallery-item';

                    const img = document.createElement('img');
                    img.src = dataUrl;
                    img.alt = `Photo ${idx + 1}`;
                    img.loading = 'lazy';

                    const del = document.createElement('button');
                    del.className = 'delete-btn';
                    del.textContent = '✕';
                    del.addEventListener('click', (e) => {
                        e.stopPropagation();
                        photos.splice(idx, 1);
                        renderGallery();
                    });

                    div.addEventListener('click', () => {
                        downloadImage(dataUrl, `photobooth_${Date.now()}.jpg`);
                    });

                    div.appendChild(img);
                    div.appendChild(del);
                    galleryGrid.appendChild(div);
                });
            }

            // ========== DOWNLOAD ==========
            function downloadImage(dataUrl, filename = 'photobooth.jpg') {
                const link = document.createElement('a');
                link.download = filename;
                link.href = dataUrl;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }

            // ========== CLEAR ==========
            function clearAll() {
                if (photos.length === 0) return;
                if (confirm('🗑️ Delete all photos?')) {
                    photos = [];
                    renderGallery();
                }
            }

            // ========== SLEEP ==========
            function sleep(ms) {
                return new Promise(r => setTimeout(r, ms));
            }

            // ========== FILTER HANDLERS ==========
            filterChips.forEach(chip => {
                chip.addEventListener('click', function() {
                    filterChips.forEach(c => c.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    filterLabel.textContent = filters[currentFilter]?.label || 'ORIGINAL';
                    console.log('🎨 Filter:', currentFilter);
                });
            });

            // ========== MIRROR TOGGLE ==========
            mirrorToggle.addEventListener('change', function() {
                isMirror = this.checked;
                wrapper.classList.toggle('mirror-on', isMirror);
                console.log('🪞 Mirror:', isMirror ? 'ON' : 'OFF');
            });

            // ========== FLASH TOGGLE ==========
            flashToggle.addEventListener('change', function() {
                useFlash = this.checked;
                console.log('⚡ Flash:', useFlash ? 'ON' : 'OFF');
            });

            // ========== EVENT LISTENERS ==========
            captureBtn.addEventListener('click', capturePhoto);

            downloadBtn.addEventListener('click', () => {
                if (photos.length === 0) {
                    alert('📸 No photos to download!');
                    return;
                }
                downloadImage(photos[photos.length - 1], `photobooth_${Date.now()}.jpg`);
            });

            clearBtn.addEventListener('click', clearAll);

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.key === ' ' || e.key === 'Enter') {
                    e.preventDefault();
                    capturePhoto();
                }
                if (e.key === 'd' || e.key === 'D') downloadBtn.click();
                if (e.key === 'c' || e.key === 'C') clearBtn.click();
            });

            // ========== RESIZE HANDLER ==========
            function handleResize() {
                // Canvas dimensions are fixed; video scales via CSS
            }

            // ========== INIT ==========
            initCamera();

            console.log('📸 PHOTOBOOTH PINK · FABLE 5');
            console.log('🎯 Space/Enter = Capture | D = Download | C = Clear');
            console.log('🪞 Mirror toggle available | ⚡ Flash toggle available');

        })();
    </script>

</body>
</html>
