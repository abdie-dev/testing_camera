<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>💗 PHOTOBOOTH · LOVE PINK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #fce4ec;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== FLOATING HEARTS BACKGROUND ===== */
        .hearts-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .heart-float {
            position: absolute;
            font-size: 1.5rem;
            opacity: 0.15;
            animation: floatHeart 20s infinite linear;
            color: #e91e63;
        }

        @keyframes floatHeart {
            0% { transform: translateY(100vh) rotate(0deg) scale(0.5); opacity: 0; }
            10% { opacity: 0.15; }
            90% { opacity: 0.15; }
            100% { transform: translateY(-10vh) rotate(720deg) scale(1.5); opacity: 0; }
        }

        .heart-float:nth-child(1) { left: 5%; animation-duration: 18s; font-size: 2rem; }
        .heart-float:nth-child(2) { left: 20%; animation-duration: 22s; font-size: 1.2rem; animation-delay: 3s; }
        .heart-float:nth-child(3) { left: 40%; animation-duration: 25s; font-size: 2.5rem; animation-delay: 5s; }
        .heart-float:nth-child(4) { left: 60%; animation-duration: 19s; font-size: 1.8rem; animation-delay: 2s; }
        .heart-float:nth-child(5) { left: 80%; animation-duration: 23s; font-size: 1.4rem; animation-delay: 7s; }
        .heart-float:nth-child(6) { left: 95%; animation-duration: 21s; font-size: 2rem; animation-delay: 4s; }

        /* ===== APP CARD ===== */
        .app-card {
            max-width: 480px;
            width: 100%;
            background: #ffffff;
            border-radius: 40px;
            padding: 20px 18px 24px;
            box-shadow: 0 20px 60px rgba(233, 30, 99, 0.2), 0 0 80px rgba(233, 30, 99, 0.08);
            border: 2px solid rgba(233, 30, 99, 0.1);
            position: relative;
            z-index: 1;
        }

        /* ===== HEADER ===== */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding: 0 2px;
        }

        .app-title {
            font-weight: 800;
            font-size: 1.3rem;
            color: #e91e63;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .app-title span {
            background: linear-gradient(135deg, #e91e63, #f06292);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .app-badge {
            font-size: 0.55rem;
            font-weight: 700;
            color: #e91e63;
            background: rgba(233, 30, 99, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(233, 30, 99, 0.15);
            letter-spacing: 0.5px;
        }

        /* ===== CAMERA ===== */
        .camera-wrapper {
            position: relative;
            border-radius: 24px;
            overflow: hidden;
            background: #fce4ec;
            aspect-ratio: 4 / 3;
            width: 100%;
            border: 3px solid rgba(233, 30, 99, 0.2);
            box-shadow: inset 0 0 40px rgba(233, 30, 99, 0.05);
        }

        .camera-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .camera-wrapper canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .camera-wrapper.mirror-on video,
        .camera-wrapper.mirror-on canvas {
            transform: scaleX(-1);
        }

        /* ===== OVERLAYS ===== */
        .overlay-countdown {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            border-radius: 24px;
        }

        .overlay-countdown.active {
            opacity: 1;
            pointer-events: auto;
        }

        .countdown-number {
            font-size: 7rem;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 60px rgba(233, 30, 99, 0.6), 0 0 120px rgba(233, 30, 99, 0.3);
            animation: pulseCount 0.7s ease-in-out infinite alternate;
            font-family: 'Quicksand', sans-serif;
        }

        @keyframes pulseCount {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.15); opacity: 0.5; }
        }

        .overlay-flash {
            position: absolute;
            inset: 0;
            background: #fff;
            z-index: 30;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.05s;
            border-radius: 24px;
        }

        .overlay-flash.active {
            opacity: 0.85;
            transition: opacity 0s;
        }

        /* ===== STATUS BADGE ===== */
        .status-badge {
            position: absolute;
            bottom: 12px;
            left: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 5px 12px 5px 8px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            z-index: 10;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4ade80;
            animation: blinkDot 1.2s infinite;
        }

        @keyframes blinkDot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        .status-dot.off {
            background: #f87171;
            animation: none;
        }

        .status-label {
            font-size: 0.5rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* ===== FILTER LABEL ===== */
        .filter-label {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 5px 12px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            z-index: 10;
            font-size: 0.5rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* ===== TOGGLES ===== */
        .toggle-row {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .toggle-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.6rem;
            font-weight: 600;
            color: #888;
            cursor: pointer;
            user-select: none;
            font-family: 'Quicksand', sans-serif;
        }

        .toggle-item input[type="checkbox"] {
            display: none;
        }

        .toggle-track {
            width: 36px;
            height: 20px;
            background: #f0f0f0;
            border-radius: 20px;
            position: relative;
            transition: all 0.3s;
            flex-shrink: 0;
            border: 1.5px solid #e0e0e0;
        }

        .toggle-track .toggle-thumb {
            width: 14px;
            height: 14px;
            background: #ccc;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: all 0.3s;
        }

        .toggle-item input:checked + .toggle-track {
            background: #fce4ec;
            border-color: #e91e63;
        }

        .toggle-item input:checked + .toggle-track .toggle-thumb {
            left: 18px;
            background: #e91e63;
            box-shadow: 0 0 20px rgba(233, 30, 99, 0.3);
        }

        /* ===== FILTERS ===== */
        .filters-scroll {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 4px 0 12px 0;
            margin-top: 12px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .filters-scroll::-webkit-scrollbar {
            display: none;
        }

        .filter-chip {
            flex: 0 0 auto;
            padding: 6px 16px;
            border-radius: 40px;
            border: 1.5px solid rgba(233, 30, 99, 0.1);
            background: rgba(233, 30, 99, 0.04);
            color: #888;
            font-size: 0.6rem;
            font-weight: 600;
            font-family: 'Quicksand', sans-serif;
            cursor: pointer;
            transition: all 0.25s;
            white-space: nowrap;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .filter-chip:active {
            transform: scale(0.94);
        }

        .filter-chip.active {
            border-color: #e91e63;
            color: #e91e63;
            background: rgba(233, 30, 99, 0.1);
            box-shadow: 0 0 24px rgba(233, 30, 99, 0.08);
        }

        /* ===== CONTROLS ===== */
        .controls-row {
            display: flex;
            gap: 8px;
            margin-top: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-capture {
            flex: 1;
            min-width: 120px;
            background: linear-gradient(135deg, #e91e63, #f06292);
            color: #fff;
            border: none;
            padding: 14px 20px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.9rem;
            font-family: 'Quicksand', sans-serif;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 24px rgba(233, 30, 99, 0.25);
            letter-spacing: 0.3px;
        }

        .btn-capture:active {
            transform: scale(0.96);
        }

        .btn-capture:disabled {
            opacity: 0.5;
            transform: none;
            box-shadow: none;
            cursor: not-allowed;
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid rgba(233, 30, 99, 0.15);
            color: #888;
            padding: 12px 14px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.75rem;
            font-family: 'Quicksand', sans-serif;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            min-width: 44px;
            flex: 0 1 auto;
            background: rgba(233, 30, 99, 0.03);
        }

        .btn-outline:active {
            transform: scale(0.94);
        }

        .btn-outline:hover {
            border-color: #e91e63;
            color: #e91e63;
        }

        /* ===== GALLERY ===== */
        .gallery-section {
            margin-top: 16px;
            border-top: 1.5px solid rgba(233, 30, 99, 0.08);
            padding-top: 14px;
        }

        .gallery-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .gallery-header h3 {
            font-size: 0.65rem;
            font-weight: 700;
            color: #e91e63;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .gallery-header span {
            font-size: 0.55rem;
            color: #aaa;
            font-weight: 600;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            max-height: 120px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .gallery-grid::-webkit-scrollbar {
            width: 3px;
        }

        .gallery-grid::-webkit-scrollbar-track {
            background: transparent;
        }

        .gallery-grid::-webkit-scrollbar-thumb {
            background: #e91e63;
            border-radius: 10px;
        }

        .gallery-item {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 4 / 3;
            background: #fce4ec;
            border: 1.5px solid rgba(233, 30, 99, 0.08);
            cursor: pointer;
            transition: all 0.2s;
        }

        .gallery-item:active {
            transform: scale(0.94);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gallery-item .delete-btn {
            position: absolute;
            top: 3px;
            right: 3px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: none;
            color: #fff;
            font-size: 10px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .gallery-item:hover .delete-btn {
            opacity: 1;
        }

        .gallery-item .delete-btn:active {
            background: #e91e63;
        }

        .empty-gallery {
            text-align: center;
            color: #ccc;
            font-size: 0.6rem;
            font-weight: 500;
            padding: 14px 0;
            grid-column: 1 / -1;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .app-card {
                padding: 14px 12px 18px;
                border-radius: 28px;
            }
            .countdown-number {
                font-size: 5rem;
            }
            .btn-capture {
                font-size: 0.75rem;
                padding: 12px 14px;
                min-width: 90px;
            }
            .btn-outline {
                padding: 10px 10px;
                font-size: 0.65rem;
                min-width: 38px;
            }
            .gallery-grid {
                grid-template-columns: repeat(4, 1fr);
                max-height: 100px;
            }
            .filter-chip {
                font-size: 0.5rem;
                padding: 5px 12px;
            }
            .app-title {
                font-size: 1.1rem;
            }
            .toggle-item {
                font-size: 0.55rem;
            }
            .toggle-track {
                width: 32px;
                height: 18px;
            }
            .toggle-track .toggle-thumb {
                width: 12px;
                height: 12px;
            }
            .toggle-item input:checked + .toggle-track .toggle-thumb {
                left: 16px;
            }
        }

        @media (max-width: 380px) {
            .controls-row {
                gap: 4px;
            }
            .btn-capture {
                font-size: 0.65rem;
                padding: 10px 10px;
                min-width: 70px;
            }
            .btn-outline {
                padding: 8px 8px;
                font-size: 0.55rem;
                min-width: 34px;
            }
            .gallery-grid {
                grid-template-columns: repeat(3, 1fr);
                max-height: 90px;
            }
            .countdown-number {
                font-size: 4rem;
            }
        }

        @media (min-width: 768px) {
            .app-card {
                max-width: 520px;
                padding: 28px 24px 30px;
                border-radius: 44px;
            }
            .countdown-number {
                font-size: 9rem;
            }
            .gallery-grid {
                max-height: 140px;
            }
        }

        @media (max-height: 600px) and (orientation: landscape) {
            .app-card {
                max-width: 400px;
                padding: 10px 14px 14px;
                border-radius: 24px;
            }
            .camera-wrapper {
                aspect-ratio: 16 / 9;
            }
            .gallery-grid {
                max-height: 70px;
            }
            .countdown-number {
                font-size: 3.5rem;
            }
            .controls-row {
                margin-top: 8px;
            }
            .gallery-section {
                margin-top: 10px;
                padding-top: 10px;
            }
            .filters-scroll {
                margin-top: 6px;
                padding-bottom: 6px;
            }
            .toggle-row {
                margin-top: 6px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== FLOATING HEARTS ===== -->
    <div class="hearts-bg">
        <span class="heart-float">❤️</span>
        <span class="heart-float">💗</span>
        <span class="heart-float">💖</span>
        <span class="heart-float">💕</span>
        <span class="heart-float">❤️</span>
        <span class="heart-float">💗</span>
    </div>

    <!-- ===== APP CARD ===== -->
    <div class="app-card">

        <!-- HEADER -->
        <div class="app-header">
            <div class="app-title">
                <span>📸 PHOTOBOOTH</span>
                <span>💗</span>
            </div>
            <span class="app-badge">LOVE PINK</span>
        </div>

        <!-- CAMERA -->
        <div class="camera-wrapper mirror-on" id="cameraWrapper">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="filterCanvas"></canvas>

            <!-- Countdown -->
            <div class="overlay-countdown" id="countdownOverlay">
                <span class="countdown-number" id="countdownNumber">3</span>
            </div>

            <!-- Flash -->
            <div class="overlay-flash" id="flashOverlay"></div>

            <!-- Status -->
            <div class="status-badge">
                <span class="status-dot" id="statusDot"></span>
                <span class="status-label" id="statusLabel">LIVE</span>
            </div>

            <!-- Filter Label -->
            <span class="filter-label" id="filterLabel">ORIGINAL</span>
        </div>

        <!-- TOGGLES -->
        <div class="toggle-row">
            <label class="toggle-item">
                <input type="checkbox" id="mirrorToggle" checked />
                <span class="toggle-track"><span class="toggle-thumb"></span></span>
                <span>🪞 Mirror</span>
            </label>
            <label class="toggle-item">
                <input type="checkbox" id="flashToggle" checked />
                <span class="toggle-track"><span class="toggle-thumb"></span></span>
                <span>⚡ Flash</span>
            </label>
        </div>

        <!-- FILTERS -->
        <div class="filters-scroll" id="filterScroll">
            <button class="filter-chip active" data-filter="none">Original</button>
            <button class="filter-chip" data-filter="grayscale">Grayscale</button>
            <button class="filter-chip" data-filter="sepia">Sepia</button>
            <button class="filter-chip" data-filter="invert">Invert</button>
            <button class="filter-chip" data-filter="blur">Blur</button>
            <button class="filter-chip" data-filter="vintage">Vintage</button>
            <button class="filter-chip" data-filter="neon">Neon</button>
            <button class="filter-chip" data-filter="pink">💗 Pink</button>
            <button class="filter-chip" data-filter="love">💕 Love</button>
        </div>

        <!-- CONTROLS -->
        <div class="controls-row">
            <button class="btn-capture" id="captureBtn">📸 Capture</button>
            <button class="btn-outline" id="downloadBtn" title="Download latest">⬇️</button>
            <button class="btn-outline" id="clearBtn" title="Clear all">🗑️</button>
        </div>

        <!-- GALLERY -->
        <div class="gallery-section">
            <div class="gallery-header">
                <h3>💗 Gallery</h3>
                <span id="galleryCount">0 photos</span>
            </div>
            <div class="gallery-grid" id="galleryGrid">
                <div class="empty-gallery">No photos yet. Capture one! 💕</div>
            </div>
        </div>

    </div>

    <!-- ===== JAVASCRIPT - MANUAL FILTERS ===== -->
    <script>
        (function() {
            'use strict';

            // ========== DOM ==========
            const video = document.getElementById('video');
            const canvas = document.getElementById('filterCanvas');
            const ctx = canvas.getContext('2d');
            const wrapper = document.getElementById('cameraWrapper');

            const captureBtn = document.getElementById('captureBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const clearBtn = document.getElementById('clearBtn');

            const countdownOverlay = document.getElementById('countdownOverlay');
            const countdownNumber = document.getElementById('countdownNumber');
            const flashOverlay = document.getElementById('flashOverlay');

            const mirrorToggle = document.getElementById('mirrorToggle');
            const flashToggle = document.getElementById('flashToggle');

            const filterChips = document.querySelectorAll('.filter-chip');
            const filterLabel = document.getElementById('filterLabel');

            const statusDot = document.getElementById('statusDot');
            const statusLabel = document.getElementById('statusLabel');

            const galleryGrid = document.getElementById('galleryGrid');
            const galleryCount = document.getElementById('galleryCount');

            // ========== STATE ==========
            let stream = null;
            let currentFilter = 'none';
            let isCapturing = false;
            let isMirror = true;
            let useFlash = true;
            let photos = [];
            let videoReady = false;
            let animFrame = null;
            let canvasWidth = 640;
            let canvasHeight = 480;

            // ========== MANUAL FILTER FUNCTIONS ==========
            // These process pixel data directly - works on ALL devices!

            function applyFilter(imageData, filterName) {
                const data = imageData.data;
                const len = data.length;

                switch (filterName) {
                    case 'none':
                        break;

                    case 'grayscale':
                        for (let i = 0; i < len; i += 4) {
                            const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                            data[i] = data[i + 1] = data[i + 2] = gray;
                        }
                        break;

                    case 'sepia':
                        for (let i = 0; i < len; i += 4) {
                            const r = data[i],
                                g = data[i + 1],
                                b = data[i + 2];
                            data[i] = Math.min(255, r * 0.393 + g * 0.769 + b * 0.189);
                            data[i + 1] = Math.min(255, r * 0.349 + g * 0.686 + b * 0.168);
                            data[i + 2] = Math.min(255, r * 0.272 + g * 0.534 + b * 0.131);
                        }
                        break;

                    case 'invert':
                        for (let i = 0; i < len; i += 4) {
                            data[i] = 255 - data[i];
                            data[i + 1] = 255 - data[i + 1];
                            data[i + 2] = 255 - data[i + 2];
                        }
                        break;

                    case 'blur':
                        // Simple box blur (3x3)
                        const temp = new Uint8ClampedArray(data);
                        const w = imageData.width;
                        const h = imageData.height;
                        for (let y = 1; y < h - 1; y++) {
                            for (let x = 1; x < w - 1; x++) {
                                const idx = (y * w + x) * 4;
                                let r = 0,
                                    g = 0,
                                    b = 0;
                                for (let dy = -1; dy <= 1; dy++) {
                                    for (let dx = -1; dx <= 1; dx++) {
                                        const nIdx = ((y + dy) * w + (x + dx)) * 4;
                                        r += temp[nIdx];
                                        g += temp[nIdx + 1];
                                        b += temp[nIdx + 2];
                                    }
                                }
                                data[idx] = r / 9;
                                data[idx + 1] = g / 9;
                                data[idx + 2] = b / 9;
                            }
                        }
                        break;

                    case 'vintage':
                        for (let i = 0; i < len; i += 4) {
                            const r = data[i],
                                g = data[i + 1],
                                b = data[i + 2];
                            data[i] = Math.min(255, r * 0.8 + g * 0.6 + b * 0.2);
                            data[i + 1] = Math.min(255, r * 0.5 + g * 0.7 + b * 0.3);
                            data[i + 2] = Math.min(255, r * 0.3 + g * 0.5 + b * 0.6);
                            // Add some grain
                            const grain = (Math.random() - 0.5) * 12;
                            data[i] = Math.max(0, Math.min(255, data[i] + grain));
                            data[i + 1] = Math.max(0, Math.min(255, data[i + 1] + grain));
                            data[i + 2] = Math.max(0, Math.min(255, data[i + 2] + grain));
                        }
                        break;

                    case 'neon':
                        for (let i = 0; i < len; i += 4) {
                            data[i] = Math.min(255, data[i] * 1.8);
                            data[i + 1] = Math.min(255, data[i + 1] * 1.0);
                            data[i + 2] = Math.min(255, data[i + 2] * 1.4);
                        }
                        break;

                    case 'pink':
                        for (let i = 0; i < len; i += 4) {
                            // Add pink tint
                            const r = data[i],
                                g = data[i + 1],
                                b = data[i + 2];
                            data[i] = Math.min(255, r * 1.1);
                            data[i + 1] = Math.min(255, g * 0.8);
                            data[i + 2] = Math.min(255, b * 0.9 + 30);
                        }
                        break;

                    case 'love':
                        for (let i = 0; i < len; i += 4) {
                            const r = data[i],
                                g = data[i + 1],
                                b = data[i + 2];
                            // Warm pink + soft
                            data[i] = Math.min(255, r * 1.2 + 20);
                            data[i + 1] = Math.min(255, g * 0.7 + 10);
                            data[i + 2] = Math.min(255, b * 0.6 + 40);
                            // Soft vignette (applied per pixel)
                            const x = (i / 4) % imageData.width;
                            const y = Math.floor((i / 4) / imageData.width);
                            const cx = imageData.width / 2;
                            const cy = imageData.height / 2;
                            const dist = Math.sqrt((x - cx) ** 2 + (y - cy) ** 2);
                            const maxDist = Math.sqrt(cx ** 2 + cy ** 2);
                            const vignette = 1 - (dist / maxDist) * 0.3;
                            data[i] = Math.min(255, data[i] * vignette);
                            data[i + 1] = Math.min(255, data[i + 1] * vignette);
                            data[i + 2] = Math.min(255, data[i + 2] * vignette);
                        }
                        break;

                    default:
                        break;
                }
                return imageData;
            }

            // ========== CAMERA INIT ==========
            async function initCamera() {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: 'user',
                            width: { ideal: 640 },
                            height: { ideal: 480 }
                        },
                        audio: false
                    });
                    video.srcObject = stream;
                    await video.play();
                    videoReady = true;

                    const vw = video.videoWidth || 640;
                    const vh = video.videoHeight || 480;
                    canvasWidth = Math.min(vw, 640);
                    canvasHeight = Math.min(vh, 480);
                    canvas.width = canvasWidth;
                    canvas.height = canvasHeight;

                    statusDot.className = 'status-dot';
                    statusLabel.textContent = 'LIVE';
                    console.log('📸 Camera ready!');
                    startRender();
                } catch (err) {
                    console.error('Camera error:', err);
                    statusDot.className = 'status-dot off';
                    statusLabel.textContent = 'OFFLINE';
                    alert('⚠️ Camera access denied or no camera found.');
                }
            }

            // ========== RENDER LOOP ==========
            function startRender() {
                if (animFrame) cancelAnimationFrame(animFrame);
                render();
            }

            function render() {
                if (!videoReady || !video.videoWidth) {
                    animFrame = requestAnimationFrame(render);
                    return;
                }

                // Draw video to canvas with mirror
                ctx.save();
                if (isMirror) {
                    ctx.translate(canvas.width, 0);
                    ctx.scale(-1, 1);
                }
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                ctx.restore();

                // Apply manual filter via pixel processing
                if (currentFilter !== 'none') {
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    applyFilter(imageData, currentFilter);
                    ctx.putImageData(imageData, 0, 0);
                }

                animFrame = requestAnimationFrame(render);
            }

            // ========== CAPTURE ==========
            async function capturePhoto() {
                if (isCapturing || !videoReady) return;
                isCapturing = true;
                captureBtn.disabled = true;

                // Countdown
                countdownOverlay.classList.add('active');
                for (let i = 3; i >= 1; i--) {
                    countdownNumber.textContent = i;
                    await sleep(700);
                }
                countdownNumber.textContent = '💗';
                await sleep(250);
                countdownOverlay.classList.remove('active');

                // Flash
                if (useFlash) {
                    flashOverlay.classList.add('active');
                    await sleep(120);
                    flashOverlay.classList.remove('active');
                }

                // Capture from canvas with current filter applied
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                const tCtx = tempCanvas.getContext('2d');
                tCtx.drawImage(canvas, 0, 0);

                // Apply filter one more time for consistency
                if (currentFilter !== 'none') {
                    const imgData = tCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
                    applyFilter(imgData, currentFilter);
                    tCtx.putImageData(imgData, 0, 0);
                }

                const dataUrl = tempCanvas.toDataURL('image/jpeg', 0.92);

                photos.push(dataUrl);
                renderGallery();
                downloadImage(dataUrl, `photobooth_${Date.now()}.jpg`);

                isCapturing = false;
                captureBtn.disabled = false;
                console.log('📸 Captured!');
            }

            // ========== GALLERY ==========
            function renderGallery() {
                galleryGrid.innerHTML = '';
                if (photos.length === 0) {
                    galleryGrid.innerHTML = '<div class="empty-gallery">No photos yet. Capture one! 💕</div>';
                    galleryCount.textContent = '0 photos';
                    return;
                }
                galleryCount.textContent = `${photos.length} photos`;

                photos.forEach((dataUrl, idx) => {
                    const div = document.createElement('div');
                    div.className = 'gallery-item';

                    const img = document.createElement('img');
                    img.src = dataUrl;
                    img.alt = `Photo ${idx + 1}`;
                    img.loading = 'lazy';

                    const del = document.createElement('button');
                    del.className = 'delete-btn';
                    del.textContent = '✕';
                    del.addEventListener('click', (e) => {
                        e.stopPropagation();
                        photos.splice(idx, 1);
                        renderGallery();
                    });

                    div.addEventListener('click', () => {
                        downloadImage(dataUrl, `photobooth_${Date.now()}.jpg`);
                    });

                    div.appendChild(img);
                    div.appendChild(del);
                    galleryGrid.appendChild(div);
                });
            }

            // ========== DOWNLOAD ==========
            function downloadImage(dataUrl, filename = 'photobooth.jpg') {
                const link = document.createElement('a');
                link.download = filename;
                link.href = dataUrl;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }

            // ========== CLEAR ==========
            function clearAll() {
                if (photos.length === 0) return;
                if (confirm('🗑️ Delete all photos?')) {
                    photos = [];
                    renderGallery();
                }
            }

            // ========== SLEEP ==========
            function sleep(ms) {
                return new Promise(r => setTimeout(r, ms));
            }

            // ========== FILTER HANDLERS ==========
            filterChips.forEach(chip => {
                chip.addEventListener('click', function() {
                    filterChips.forEach(c => c.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    const labels = {
                        none: 'ORIGINAL',
                        grayscale: 'GRAYSCALE',
                        sepia: 'SEPIA',
                        invert: 'INVERT',
                        blur: 'BLUR',
                        vintage: 'VINTAGE',
                        neon: 'NEON',
                        pink: '💗 PINK',
                        love: '💕 LOVE'
                    };
                    filterLabel.textContent = labels[currentFilter] || 'ORIGINAL';
                    console.log('🎨 Filter:', currentFilter);
                });
            });

            // ========== TOGGLES ==========
            mirrorToggle.addEventListener('change', function() {
                isMirror = this.checked;
                wrapper.classList.toggle('mirror-on', isMirror);
                console.log('🪞 Mirror:', isMirror ? 'ON' : 'OFF');
            });

            flashToggle.addEventListener('change', function() {
                useFlash = this.checked;
                console.log('⚡ Flash:', useFlash ? 'ON' : 'OFF');
            });

            // ========== EVENT LISTENERS ==========
            captureBtn.addEventListener('click', capturePhoto);

            downloadBtn.addEventListener('click', () => {
                if (photos.length === 0) {
                    alert('📸 No photos to download!');
                    return;
                }
                downloadImage(photos[photos.length - 1], `photobooth_${Date.now()}.jpg`);
            });

            clearBtn.addEventListener('click', clearAll);

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.key === ' ' || e.key === 'Enter') {
                    e.preventDefault();
                    capturePhoto();
                }
                if (e.key === 'd' || e.key === 'D') downloadBtn.click();
                if (e.key === 'c' || e.key === 'C') clearBtn.click();
            });

            // ========== INIT ==========
            initCamera();

            console.log('💗 PHOTOBOOTH LOVE PINK · FABLE 5');
            console.log('🎯 Space/Enter = Capture | D = Download | C = Clear');
            console.log('🪞 Mirror toggle | ⚡ Flash toggle');
            console.log('🎨 Manual pixel filters - works on ALL devices!');

        })();
    </script>

</body>
